<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#8a3d2c">
  <meta name="description" content="Explore engaging English quizzes and exercises from the Balmain English Learning Library.">
  <title>English Quizzes | Balmain English Learning Library</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #39291f;
      --muted: #716052;
      --rust: #9c422f;
      --rust-dark: #713020;
      --gold: #d49a3a;
      --cream: #fff8eb;
      --paper: #f7ead8;
      --line: #e7d4b8;
    }
    * { box-sizing: border-box; }
    html { min-height: 100%; scroll-behavior: smooth; }
    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 85% 4%, rgba(255,255,255,.82), transparent 34%),
        radial-gradient(ellipse at 8% 36%, rgba(239,190,111,.25), transparent 36%),
        linear-gradient(135deg, #fbf4e9 0%, #f0dfc7 52%, #f8efe2 100%);
      font: 15px/1.55 "Segoe UI", Arial, sans-serif;
    }
    .shell { width: min(1120px, calc(100% - 40px)); margin-inline: auto; }
    .masthead {
      color: #fffaf1;
      background: linear-gradient(110deg, #382a25, #633829 58%, #803e2c);
      border-bottom: 4px solid var(--gold);
      box-shadow: 0 5px 18px rgba(67, 42, 27, .18);
    }
    .masthead-inner { min-height: 66px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: .02em; }
    .brand-mark {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border: 1px solid #e6c997;
      border-radius: 50%;
      color: #ffe9bf;
      font: 1.15rem Georgia, serif;
      box-shadow: inset 0 0 0 3px rgba(255,255,255,.07);
    }
    .library-label { color: #f0deca; font-size: .82rem; }
    main { padding: 38px 0 48px; }
    .hero {
      position: relative;
      overflow: hidden;
      padding: clamp(32px, 6vw, 68px);
      border: 1px solid rgba(255,255,255,.9);
      border-radius: 12px;
      background: linear-gradient(125deg, rgba(255,253,248,.96), rgba(255,242,219,.93) 56%, rgba(248,225,190,.9));
      box-shadow: 0 17px 42px rgba(82, 54, 31, .14), inset 0 1px 0 #fff;
    }
    .hero::after {
      position: absolute;
      top: -110px;
      right: -85px;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(156,66,47,.11);
      border-radius: 50%;
      box-shadow: 0 0 0 24px rgba(156,66,47,.035), 0 0 0 50px rgba(156,66,47,.025);
      content: "";
      pointer-events: none;
    }
    .intro { position: relative; z-index: 1; }
    .eyebrow { margin: 0 0 8px; color: var(--rust); font-size: .73rem; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
    h1 { margin: 0; color: #402b22; font: 600 clamp(2.15rem, 5vw, 3.55rem)/1.1 Georgia, "Times New Roman", serif; letter-spacing: -.03em; }
    .lede { max-width: 660px; margin: 13px 0 0; color: #685548; font-size: 1.02rem; }
    .collection { position: relative; z-index: 1; margin-top: 42px; }
    .toolbar { display: flex; align-items: center; justify-content: space-between; gap: 18px; margin-bottom: 17px; }
    .section-title { margin: 0; color: #402f25; font: 600 1.2rem Georgia, "Times New Roman", serif; }
    .count { margin-left: 8px; color: var(--muted); font: 500 .78rem "Segoe UI", Arial, sans-serif; }
    .search {
      width: min(310px, 100%);
      min-height: 43px;
      padding: 9px 13px;
      border: 1px solid #cdb89a;
      border-radius: 6px;
      background: rgba(255,255,255,.88);
      color: var(--ink);
      font: inherit;
      box-shadow: inset 0 1px 2px rgba(57,41,31,.06);
    }
    .search::placeholder { color: #76695e; }
    .search:focus-visible { outline: 3px solid rgba(156,66,47,.25); outline-offset: 2px; border-color: var(--rust); }
    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 0; margin: 0; list-style: none; }
    .grid li { min-width: 0; }
    .card {
      display: flex;
      min-height: 108px;
      height: 100%;
      flex-direction: column;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px 14px;
      border: 1px solid #b87553;
      border-radius: 7px;
      background: linear-gradient(145deg, #fffdfa 0%, #fff0d6 58%, #f2d5a9 100%);
      box-shadow: 0 4px 10px rgba(93, 51, 31, .10), inset 0 1px 0 rgba(255,255,255,.95);
      color: var(--ink);
      text-decoration: none;
      transition: transform .16s ease, box-shadow .16s ease, border-color .16s ease;
    }
    .card:hover {
      transform: translateY(-3px);
      border-color: var(--rust);
      background: linear-gradient(145deg, #fffefa 0%, #ffe7c2 58%, #edc58b 100%);
      box-shadow: 0 9px 19px rgba(93, 51, 31, .17), inset 0 1px 0 #fff;
    }
    .card:focus-visible { outline: 3px solid var(--rust); outline-offset: 3px; }
    .card-title { font-size: 1rem; font-weight: 700; line-height: 1.35; overflow-wrap: anywhere; }
    .card-meta { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 9px; border-top: 1px solid rgba(137,86,54,.22); color: #665344; font-size: .77rem; }
    .open { color: var(--rust-dark); font-weight: 750; white-space: nowrap; }
    .message { grid-column: 1 / -1; padding: 22px; border: 1px dashed #c5a984; border-radius: 6px; background: rgba(255,255,255,.68); color: var(--muted); text-align: center; }
    footer { padding: 18px 0 24px; color: #695849; font-size: .78rem; text-align: center; }
    @media (max-width: 800px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } main { padding-top: 25px; } }
    @media (max-width: 560px) {
      .shell { width: calc(100% - 28px); }
      .masthead-inner { min-height: 58px; }
      .hero { padding: 32px 20px; }
      .hero::after { right: -210px; }
      .toolbar { align-items: stretch; flex-direction: column; gap: 12px; }
      .search { width: 100%; }
      .grid { grid-template-columns: 1fr; }
      .collection { margin-top: 32px; }
    }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; } .card:hover { transform: none; } }
  </style>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div class="brand"><span class="brand-mark" aria-hidden="true">B</span><span>Balmain English</span></div>
      <div class="library-label">Learning Library</div>
    </div>
  </header>
  <main class="shell">
    <div class="hero">
      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">A little practice goes a long way</p>
        <h1 id="page-title">English Quizzes</h1>
        <p class="lede">Explore lively quizzes and put your English skills to the test. New exercises added to the collection will appear here automatically.</p>
      </section>
      <section class="collection" aria-label="English quiz directory">
        <div class="toolbar">
          <h2 class="section-title">Choose an exercise <span class="count" id="count" aria-live="polite">Loading…</span></h2>
          <input id="search" class="search" type="search" placeholder="Search exercises" aria-label="Search English quiz exercises">
        </div>
        <ul id="items" class="grid" aria-live="polite" aria-busy="true"></ul>
      </section>
    </div>
  </main>
  <footer><div class="shell">Balmain English · Learning Library</div></footer>
  <script>
    (() => {
      const owner = 'Balmain-English';
      const repo = 'quizzes';
      const branch = 'main';
      const list = document.getElementById('items');
      const search = document.getElementById('search');
      const count = document.getElementById('count');
      let pages = [];

      const titleOf = path => path.split('/').pop()
        .replace(/\.html?$/i, '')
        .replace(/[-_]+/g, ' ')
        .replace(/\s+/g, ' ')
        .trim()
        .replace(/\b\w/g, character => character.toUpperCase());

      function render() {
        const query = search.value.trim().toLowerCase();
        const visible = pages.filter(page => page.title.toLowerCase().includes(query) || page.path.toLowerCase().includes(query));
        count.textContent = `${visible.length} ${visible.length === 1 ? 'exercise' : 'exercises'}`;
        list.replaceChildren();

        if (!visible.length) {
          const item = document.createElement('li');
          item.className = 'message';
          item.textContent = pages.length ? 'No exercises match your search.' : 'No exercises are available yet. Check back soon.';
          list.append(item);
          return;
        }

        const fragment = document.createDocumentFragment();
        visible.forEach(page => {
          const item = document.createElement('li');
          const link = document.createElement('a');
          link.className = 'card';
          link.href = './' + page.path.split('/').map(encodeURIComponent).join('/');
          const title = document.createElement('span');
          title.className = 'card-title';
          title.textContent = page.title;
          const meta = document.createElement('span');
          meta.className = 'card-meta';
          const kind = document.createElement('span');
          kind.textContent = 'English exercise';
          const open = document.createElement('span');
          open.className = 'open';
          open.textContent = 'Start quiz ↗';
          meta.append(kind, open);
          link.append(title, meta);
          item.append(link);
          fragment.append(item);
        });
        list.append(fragment);
      }

      fetch(`https://api.github.com/repos/${owner}/${repo}/git/trees/${branch}?recursive=1`, { cache: 'no-store' })
        .then(response => {
          if (!response.ok) throw new Error('Unable to load exercises');
          return response.json();
        })
        .then(data => {
          pages = (data.tree || [])
            .filter(file => file.type === 'blob' && /\.html?$/i.test(file.path) && !/^index\.html?$/i.test(file.path.split('/').pop()))
            .map(file => ({ path: file.path, title: titleOf(file.path) }))
            .sort((a, b) => a.title.localeCompare(b.title));
          list.setAttribute('aria-busy', 'false');
          render();
        })
        .catch(() => {
          count.textContent = 'Exercises unavailable';
          list.setAttribute('aria-busy', 'false');
          const message = document.createElement('li');
          message.className = 'message';
          message.textContent = 'Unable to load exercises right now. Please try again later.';
          list.replaceChildren(message);
        });

      search.addEventListener('input', render);
    })();
  </script>
</body>
</html>
